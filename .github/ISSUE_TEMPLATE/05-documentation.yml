name: Documentation improvement
description: Improve a specification, example, installation guide or explanation.
title: '[Docs]: '
labels:
- documentation
body:
- type: input
  id: location
  attributes:
    label: Affected document or example
    description: Link the file and relevant section.
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: What is unclear, missing or incorrect?
    description: Explain where the reader gets stuck or which statements disagree.
  validations:
    required: true
- type: textarea
  id: change
  attributes:
    label: Proposed improvement
    description: Describe the correction and intended reader outcome.
  validations:
    required: true
- type: textarea
  id: verification
  attributes:
    label: How to verify the change
    description: State how the example, links or requirement consistency can be checked.
  validations:
    required: false
