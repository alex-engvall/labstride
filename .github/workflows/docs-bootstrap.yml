name: Docs dependency lock bootstrap

# Temporary, branch-scoped setup job. Removed before the documentation PR is ready.
on:
  push:
    branches: [docs/astro-starlight]
    paths:
      - docs-site/package.json
      - .github/workflows/docs-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: docs-lock-bootstrap
  cancel-in-progress: false

jobs:
  lock:
    if: github.repository == 'engshort/labstride' && github.ref == 'refs/heads/docs/astro-starlight'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/astro-starlight
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Resolve documentation dependencies without executing package scripts
        working-directory: docs-site
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the generated lockfile to this setup branch
        run: |
          git add -- docs-site/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(docs): lock documentation dependencies'
          git push origin HEAD:refs/heads/docs/astro-starlight
