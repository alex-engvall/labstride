name: Documentation

on:
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
      - 'requirements-docs.txt'
      - 'scripts/validate_docs.py'
      - 'scripts/render_docs.py'
      - 'scripts/schema_validation.py'
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build and test documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: docs-site/.node-version
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Validate repository documentation
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-validation"
          "$RUNNER_TEMP/docs-validation/bin/python" -m pip install --disable-pip-version-check -r requirements-docs.txt
          "$RUNNER_TEMP/docs-validation/bin/python" scripts/validate_docs.py
      - name: Install locked documentation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static documentation and local search index
        run: npm run build
      - name: Verify routes, canonical URLs and local links
        run: npm test
      - name: Install Chromium for browser checks
        run: npm exec -- playwright install --with-deps chromium
      - name: Test navigation, search and theme on desktop and mobile
        run: npm run test:browser
      - name: Upload Pages artifact from main only
        if: github.repository == 'engshort/labstride' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs-site/dist

  deploy:
    name: Publish docs.labstride.dev
    if: github.repository == 'engshort/labstride' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
